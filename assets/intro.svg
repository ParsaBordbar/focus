    </linearGradient>
    <linearGradient id="unfade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset=".3" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="calm-mask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <mask id="chaos-mask"><rect width="1200" height="420" fill="url(#unfade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .75  0 0 0 0 .79  0 0 0 0 .96  0 0 0 .08 0"/></filter>
    <filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

