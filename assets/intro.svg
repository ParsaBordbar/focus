<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Focus: from distracted to focused">
  <style>
    .clutter { fill: none; stroke: #c0caf5; stroke-linecap: round; transform-origin: 300px 210px; animation: drift 60s linear infinite; }
    .clutter .hot { stroke: #f7768e; }
    .clutter .dot { fill: #c0caf5; stroke: none; }
    .clutter .dashed { animation: crawl 2.5s linear infinite; }
    .lines { stroke: #c0caf5; stroke-opacity: .09; stroke-width: 1; animation: slide 6s linear infinite; }
    .breathe { transform-origin: 900px 200px; animation: breathe 4s ease-out infinite; }
    .progress { animation: fill 12s linear infinite; }
    text { font-family: "Nova Square", ui-monospace, "SF Mono", Menlo, monospace; }
    @keyframes drift { to { transform: rotate(360deg); } }
    @keyframes crawl { to { stroke-dashoffset: -40; } }
    @keyframes slide { to { transform: translateX(26px); } }
    @keyframes breathe { from { transform: scale(1); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
    @keyframes fill { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="distracted" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2133"/><stop offset=".5" stop-color="#24283b"/><stop offset="1" stop-color="#2a1f30"/>
    </linearGradient>
    <radialGradient id="calm" cx="900" cy="200" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24283b"/><stop offset=".55" stop-color="#1a1b26"/><stop offset="1" stop-color="#16161e"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
